version: '3.8'

services:
  agentic-rag:
    build: .
    ports:
      - "8501:8501"
    environment:
      # These environment variables will be injected at runtime
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - HF_HOME=/app/.hf_cache
